<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoneCare – Diet &amp; Recovery Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<aside class="side offcanvas-lg offcanvas-start" id="side">
  <div class="p-3 d-flex justify-content-between align-items-center">
    <h5 class="mb-0 brand"><i class="bi bi-heart-pulse-fill"></i> BoneCare</h5>
    <button class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#side"></button>
  </div>
  <nav class="nav flex-column px-2">
    <a class="nav-link" data-view="dash" href="#dash"><i class="bi bi-grid"></i> Dashboard</a>
    <a class="nav-link" data-view="diet" href="#diet"><i class="bi bi-calendar-check"></i> Diet Planner</a>
    <a class="nav-link" data-view="nut" href="#nut"><i class="bi bi-bar-chart"></i> Nutrition Tracker</a>
    <a class="nav-link" data-view="rec" href="#rec"><i class="bi bi-bandaid"></i> Injury Recovery</a>
    <a class="nav-link" data-view="set" href="#set"><i class="bi bi-gear"></i> Settings</a>
  </nav>
  <p class="small text-secondary p-3 mt-auto mb-0">Approximate values. This app does not replace your orthopaedic doctor's advice.</p>
</aside>

<div class="main">
  <header class="top">
    <div class="d-flex align-items-center gap-2 mb-2">
      <button class="btn btn-light d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#side"><i class="bi bi-list"></i></button>
      <div class="flex-grow-1"><div id="dlabel" class="dlabel"></div></div>
      <button class="btn btn-sm btn-success" data-a="today"><i class="bi bi-calendar-event"></i> Today</button>
      <button class="btn btn-sm btn-light" data-a="theme" title="Light / dark"><i class="bi bi-moon-stars"></i></button>
    </div>
    <div class="d-flex align-items-stretch gap-1">
      <button class="btn btn-light" data-a="wk" data-v="-1" title="Previous week"><i class="bi bi-chevron-left"></i></button>
      <div id="strip" class="strip flex-grow-1"></div>
      <button class="btn btn-light" data-a="wk" data-v="1" title="Next week"><i class="bi bi-chevron-right"></i></button>
    </div>
  </header>
  <main id="app" class="p-3"></main>
</div>

<div class="modal fade" id="mod" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h6 class="modal-title" id="mTitle"></h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="row g-2">
      <div class="col-12"><label class="form-label small">Food name</label><input id="mName" class="form-control" list="foodsList" autocomplete="off"></div>
      <div class="col-4"><label class="form-label small">Quantity</label><input id="mQty" type="number" min="0" step="any" class="form-control"></div>
      <div class="col-4"><label class="form-label small">Unit</label>
        <select id="mUnit" class="form-select"><option>ml</option><option>g</option><option>pcs</option><option>cup</option><option>tbsp</option><option>plate</option><option>serving</option></select></div>
      <div class="col-4"><label class="form-label small">Time</label><input id="mTime" type="time" class="form-control"></div>
      <div class="col-12"><label class="form-label small">Note</label><input id="mNote" class="form-control" placeholder="Optional"></div>
    </div>
    <h6 class="mt-3 small text-secondary">Approximate nutrition for this quantity</h6>
    <div class="row g-2" id="mN">
      <div class="col-3"><label class="small">kcal</label><input data-k="kcal" type="number" step="any" class="form-control form-control-sm"></div>
      <div class="col-3"><label class="small">Protein g</label><input data-k="p" type="number" step="any" class="form-control form-control-sm"></div>
      <div class="col-3"><label class="small">Calcium mg</label><input data-k="ca" type="number" step="any" class="form-control form-control-sm"></div>
      <div class="col-3"><label class="small">Iron mg</label><input data-k="fe" type="number" step="any" class="form-control form-control-sm"></div>
      <div class="col-3"><label class="small">Vit D mcg</label><input data-k="d" type="number" step="any" class="form-control form-control-sm"></div>
      <div class="col-3"><label class="small">Vit C mg</label><input data-k="c" type="number" step="any" class="form-control form-control-sm"></div>
      <div class="col-3"><label class="small">Carbs g</label><input data-k="carb" type="number" step="any" class="form-control form-control-sm"></div>
      <div class="col-3"><label class="small">Fat g</label><input data-k="fat" type="number" step="any" class="form-control form-control-sm"></div>
    </div>
  </div>
  <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success" data-a="save">Save</button></div>
</div></div></div>
<datalist id="foodsList"></datalist>
<input type="file" id="file" accept="application/json" hidden data-c="file">

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
